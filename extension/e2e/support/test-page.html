<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Klaxon e2e test page</title>
    <style>
      /*
        CSS-leak trap for the on-page Canvas overlay. These are deliberately
        wrong values for the Klaxon design tokens, set on :root.

        Custom properties inherit across the shadow boundary, so any overlay node
        that resolved `var(--token)` without a private value would pick up the
        poison below. The overlay (canvas.svelte.ts) instead uses literal inline
        colors/sizes, so it must stay immune — css-leaks.spec.ts locks a
        selection and fails if the overlay's brand styling shifts to these.

        The values only need to differ from the real ones; they're intentionally
        garish so a leak is obvious in --headed runs too.
      */
      :root {
        --font-sans: "Comic Sans MS", cursive;
        --font-xs: 40px;
        --font-sm: 41px;
        --font-md: 42px;
        --font-lg: 43px;
        --font-xl: 44px;

        --klaxon-color-link: lime;
        --white: black;
        --gray-1: hotpink;
        --gray-2: hotpink;
        --gray-3: hotpink;
        --gray-4: hotpink;
        --blue-1: lime;
        --blue-2: lime;
        --blue-3: lime;
        --blue-4: lime;
        --orange-1: purple;
        --orange-2: purple;
        --orange-3: purple;
        --orange-4: purple;
        --red-1: cyan;
        --red-2: cyan;
        --red-3: cyan;
        --red-4: cyan;

        --klaxon-bg: magenta;
        --klaxon-bg-dark: teal;

        --klaxon-border-radius: 99px;
      }
    </style>
  </head>
  <body>
    <h1>Klaxon e2e test page</h1>
  </body>
</html>
