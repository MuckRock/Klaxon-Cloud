name: Package

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    working-directory: extension

# Build-time config baked into the bundle (envPrefix: "MUCKROCK_").
# CLIENT_ID and KLAXON_ID come from repo variables so testers can sign in;
# the rest fall back to the dev-environment defaults from .env.example.
# Set these under Settings → Secrets and variables → Actions → Variables:
#   MUCKROCK_CLIENT_ID   — Squarelet OIDC public client id (PKCE, no secret)
#   MUCKROCK_KLAXON_ID   — Klaxon add-on's numeric id in DocumentCloud
env:
  MUCKROCK_ACCOUNTS_HOST: ${{ vars.MUCKROCK_ACCOUNTS_HOST || 'https://accounts.muckrock.com/' }}
  MUCKROCK_CLIENT_ID: ${{ vars.MUCKROCK_CLIENT_ID }}
  MUCKROCK_SCOPES: ${{ vars.MUCKROCK_SCOPES || 'openid profile email uuid organizations' }}
  MUCKROCK_DOCUMENTCLOUD_API: ${{ vars.MUCKROCK_DOCUMENTCLOUD_API || 'https://api.www.documentcloud.org/api/' }}
  MUCKROCK_KLAXON_ID: ${{ vars.MUCKROCK_KLAXON_ID || 436 }}

jobs:
  package:
    runs-on: ubuntu-latest
    # Needed for ncipollo/release-action to create the GitHub release.
    permissions:
      contents: write
    steps:
      # `lfs: true` is required, not cosmetic: the icons and fonts under
      # extension/static/ are Git LFS objects (see .gitattributes). A plain
      # checkout leaves ~130-byte pointer *text* files in their place, which vite
      # happily copies into build/<browser>/ — the build succeeds and the zip
      # looks complete, but every icon and font in it is unreadable. That's what
      # made the Chrome Web Store reject an upload with "The icon file
      # icon-128.png could not be processed."
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # One install at the workspace root links @klaxon/lib into each package.
      - name: Install
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Build
        run: npm run build

      # Belt to the `lfs: true` braces above: fail here, loudly, rather than
      # shipping a zip whose icons and fonts are LFS pointer text. Catches both a
      # missing/failed LFS fetch and any future asset that gets LFS-tracked
      # without the workflow noticing.
      - name: Verify LFS assets were fetched
        run: |
          pointers=$(grep -rl 'https://git-lfs.github.com/spec/v1' build/ || true)
          if [ -n "$pointers" ]; then
            echo "::error::Git LFS pointer files found in the build output — LFS objects were not fetched:"
            echo "$pointers"
            exit 1
          fi

      - name: Stage packages
        id: stage
        run: |
          # Expose the sha and date as step outputs so later steps can build
          # the artifact and release names.
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Date-based release tag; the short sha keeps same-day builds unique.
          echo "build_date=$(date -u +%Y.%m.%d)" >> "$GITHUB_OUTPUT"

          # `npm run build` emits one tailored extension per browser under
          # build/<browser>/ (Chrome and Firefox need different manifests). Stage
          # each into its own package dir so the unzipped folder is what you load
          # directly: the loadable files (manifest.json, content.js,
          # background.js, icons) sit at the root alongside the instructions.
          # Exclude dev-only artifacts (robots.txt) that vite copies
          # from static/ but the extension doesn't use.
          built="commit: ${{ github.sha }}
          built:  $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for browser in chrome firefox; do
            dest="package/$browser"
            mkdir -p "$dest"
            cp -R "build/$browser/." "$dest"/
            rm -rf "$dest/robots.txt"

            cp packaging/INSTALL.md "$dest/INSTALL.md"
            printf 'Klaxon Cloud test build (%s)\n%s\n' "$browser" "$built" \
              > "$dest/BUILD-INFO.txt"
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: klaxon-cloud-extension-${{ steps.stage.outputs.short_sha }}
          path: extension/package/
          if-no-files-found: error

      - name: Zip packages
        run: |
          # One zip per browser is attached to the release; the unzipped folder
          # is what you load directly into that browser.
          for browser in chrome firefox; do
            (cd "package/$browser" && \
              zip -r "../../klaxon-cloud-extension-$browser-${{ steps.stage.outputs.short_sha }}.zip" .)
          done

      - name: Build Chrome Web Store package
        # The zips above are keyed test builds for sideloading (the `key` pins a
        # stable extension ID whose OAuth redirect URI is registered on
        # Squarelet, so tester sign-in works). The Web Store, however, rejects
        # any manifest containing `key`, so rebuild Chrome with the key stripped
        # for upload. The `key` stays in manifest/chrome.json; Google re-applies
        # the same public key on publish, so the published ID — and its redirect
        # URI — still match the test builds.
        run: OMIT_KEY=true npm run build:chrome

      - name: Zip Chrome Web Store package
        run: |
          # Drop the dev-only robots.txt vite copies from static/; ship only the
          # extension files the store needs.
          rm -f build/chrome/robots.txt
          (cd build/chrome && \
            zip -r "../../klaxon-cloud-extension-chrome-webstore-${{ steps.stage.outputs.short_sha }}.zip" .)

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ steps.stage.outputs.build_date }}-${{ steps.stage.outputs.short_sha }}
          name: Klaxon Cloud build ${{ steps.stage.outputs.build_date }} (${{ steps.stage.outputs.short_sha }})
          artifacts: "extension/klaxon-cloud-extension-chrome-${{ steps.stage.outputs.short_sha }}.zip,extension/klaxon-cloud-extension-chrome-webstore-${{ steps.stage.outputs.short_sha }}.zip,extension/klaxon-cloud-extension-firefox-${{ steps.stage.outputs.short_sha }}.zip"
          allowUpdates: true
          generateReleaseNotes: true
