name: Test

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: extension

# Environment variables are imported, but tests mock the actual values, so these are placeholders
env:
  MUCKROCK_DOCUMENTCLOUD_API: https://api.dev.documentcloud.org/api/
  MUCKROCK_KLAXON_ID: "999"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

  # Runs in parallel with `test`: loads the *built* extension into a persistent
  # Chromium context and exercises the views + accessibility scans (e2e/).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install
        run: npm ci

      # The suite loads the built extension into a persistent Chromium context,
      # so it needs a real browser (+ its OS libraries). Pin to chromium, the
      # channel e2e/fixtures.ts launches.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # e2e/global-setup.ts builds the extension before the suite and requires
      # extension/.env (MUCKROCK_* are baked in at build time). The mocked API
      # is matched by path, so hosts/IDs don't matter — but MUCKROCK_CLIENT_ID
      # must be non-empty: src/lib/auth.svelte.ts config() throws on an empty
      # client id, which fails getAccessToken() and every authenticated request.
      # The example leaves it blank, so set a dummy (auth is seeded in-test).
      - name: Provide build env
        run: |
          cp .env.example .env
          sed -i 's/^MUCKROCK_CLIENT_ID=.*/MUCKROCK_CLIENT_ID="e2e"/' .env

      # github reporter annotates failures inline on the PR; html captures the
      # axe-core attachments and traces for the uploaded report.
      - name: Run e2e tests
        run: npm run test:e2e -- --reporter=github,html

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: extension/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
