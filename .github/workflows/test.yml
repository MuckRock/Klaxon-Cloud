name: Test

on:
  pull_request:
  push:
    branches: [main]

# Environment variables are imported, but tests mock the actual values, so these are placeholders
env:
  MUCKROCK_DOCUMENTCLOUD_API: https://api.dev.documentcloud.org/api/
  MUCKROCK_KLAXON_ID: "999"

jobs:
  lib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lib
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # One install at the workspace root links @klaxon/lib into each package.
      - name: Install
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Check (lib)
        run: npm run check

      - name: Test (lib)
        run: npm test

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ github.workspace }}

      - name: Check (extension)
        run: npm run check

      - name: Test (extension)
        run: npm test

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ github.workspace }}

      # The site's vitest "client" project runs component tests in a real
      # browser (@vitest/browser-playwright), so Chromium has to be installed.
      # Its own job rather than a shared step, so the lib and extension unit
      # tests don't wait on the browser download.
      - name: Install Playwright with Chromium
        run: npx playwright install --with-deps chromium

      # Server config is read lazily through $env/dynamic/private, and the API
      # is mocked, so neither step needs the MUCKROCK_* values.
      - name: Check (site)
        run: npm run check

      - name: Test (site)
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci
        working-directory: ${{ github.workspace }}

      # The suite loads the built extension into a persistent Chromium context.
      - name: Install Playwright with Chromium
        run: npx playwright install --with-deps chromium

      # e2e/global-setup.ts builds the extension and requires extension/.env
      # (MUCKROCK_* are baked in at build time). The mocked API is matched by
      # path, so hosts/IDs don't matter — but MUCKROCK_CLIENT_ID must be non-empty:
      # src/lib/auth.svelte.ts config() throws on an empty client id.
      - name: Provide build env
        run: |
          cp .env.example .env
          sed -i 's/^MUCKROCK_CLIENT_ID=.*/MUCKROCK_CLIENT_ID="e2e"/' .env

      # github reporter annotates failures inline on the PR; html captures the
      # axe-core attachments and traces for the uploaded report.
      - name: Run e2e tests
        run: npm run test:e2e -- --reporter=github,html

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: extension/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
